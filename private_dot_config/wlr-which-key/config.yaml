# Theming
font: JetBrainsMono Nerd Font 12
background: "#282828d0"
color: "#fbf1c7"
border: "#8ec07c"
separator: " ➜ "
border_width: 2
corner_r: 10
padding: 15 # Defaults to corner_r
rows_per_column: 5 # No limit by default
column_padding: 25 # Defaults to padding

# Anchor and margin
anchor: bottom # One of center, left, right, top, bottom, bottom-left, top-left, etc.
# Only relevant when anchor is not center
margin_right: 0
margin_bottom: 0
margin_left: 0
margin_top: 0

# namespace to use for the layer shell surface
# namespace: "wlr_which_key"

# Permits key bindings that conflict with compositor key bindings.
# Default is `false`.
inhibit_compositor_keyboard_shortcuts: true

# Try to guess the correct keyboard layout to use. Default is `false`.
auto_kbd_layout: true

menu:
  - key: "p"
    desc: Power
    submenu:
      - key: "s"
        desc: Sleep
        cmd: systemctl suspend
      - key: "r"
        desc: Reboot
        cmd: reboot
      - key: "o"
        desc: Off
        cmd: poweroff
  - key: "o"
    desc: Open
    submenu:
      - key: "f"
        desc: firefox
        cmd: exec firefox
      - key: "o"
        desc: obsidian
        cmd: exec obsidian
      - key: "n"
        desc: neovim
        cmd: exec nvim
      - key: "d"
        desc: dolphin
        cmd: exec dolphin
      - key: "t"
        desc: terminal
        cmd: exec alacritty
  - key: "q"
    desc: quit
    cmd: kill
  - key: "h"
    desc: left
    cmd: focus left
  - key: "l"
    desc: right
    cmd: focus right
  - key: "j"
    desc: down
    cmd: focus down
  - key: "k"
    desc: up
    cmd: focus up
  - key: "H"
    desc: move left
    cmd: move left
  - key: "L"
    desc: move right
    cmd: move right
  - key: "J"
    desc: move down
    cmd: move down
  - key: "K"
    desc: move up
    cmd: move up
